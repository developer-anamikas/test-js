<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black; color: aliceblue;">
    
</body>
<script>
    const div=document.createElement('div')
    console.log(div)
    div.className="Anamika"
    div.id="GOOGLE"
    div.setAttribute('title','generated title')
    div.style.display="inline-block"
    div.style.color="orange"
    div.style.background="white"
    div.style.padding="5px"
    div.innerText="Anamika Sahu"                            //creates text and add it to div
    const addText=document.createTextNode(' MSIT ')         //creates child node and add it to div element
    div.append(addText)

    document.body.appendChild(div)              //now you need to add this to your Html code from memory


</script>
</html>
